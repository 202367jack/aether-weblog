# 博客站点配置，安装位置：<nginx 前缀>/conf/sites/blog.conf
# 由 scripts/install-nginx.sh 写入；之后手工改动不会被覆盖。
# 换域名时只改 server_name，然后 nginx -s reload。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/blog;
    index index.html;
    charset utf-8;

    # 静态资源 7 天缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML 不缓存，保证发文后立刻可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # certbot webroot 校验用
    location /.well-known/acme-challenge/ {
        root /var/www/blog;
    }
}
